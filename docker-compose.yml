services:
  db:
    image: postgres:16-alpine
    container_name: digital-urpaq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_urpaq}
      POSTGRES_USER: ${POSTGRES_USER:-digital_urpaq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digital_urpaq_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digital_urpaq} -d ${POSTGRES_DB:-digital_urpaq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: digital-urpaq-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://digital_urpaq:digital_urpaq_password@db:5432/digital_urpaq}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: digital-urpaq-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
